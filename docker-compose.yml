name: duanagenttaichinh

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./frontend/dist:/app/frontend/dist
    command: uvicorn risk_dashboard.api.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run build -- --watch"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
  frontend-node-modules:
